version: '3.8'

services:
  # ==============================================================================
  # BACKEND API (EXPRESS.JS 3-TIER ARCHITECTURE)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photobooth_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CANVA_API_KEY=${CANVA_API_KEY:-}
      - CANVA_CLIENT_ID=${CANVA_CLIENT_ID:-}
      - CANVA_CLIENT_SECRET=${CANVA_CLIENT_SECRET:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-zumppi_photobooth_secure_key_2026}
      - SESSION_RETENTION_HOURS=${SESSION_RETENTION_HOURS:-24}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost}
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - photobooth-net

  # ==============================================================================
  # FRONTEND (NEXT.JS 14 APP ROUTER — ZUMP.PI AESTHETIC)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: photobooth_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - photobooth-net

  # ==============================================================================
  # NGINX REVERSE PROXY & GATEWAY
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: photobooth_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - photobooth-net

networks:
  photobooth-net:
    driver: bridge
